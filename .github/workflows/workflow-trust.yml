# P2-4 standing workflow-trust lint - trusted default-branch status check.
#
# Addresses GATE3-EVENT-CONTRACT-SECURITY-SCENARIO-REVIEW-R1-2026-10-09.md
# finding P2-4 (end of its §5, "Smallest concrete dependency that would
# settle the residual"): the current `scn020-trusted-event-contract.yml`
# is safe only by abstention (its pinned bytes carry zero `secrets.`
# references), not by any enforced invariant - nothing stops a future
# default-branch edit from combining `secrets.*` with a checkout/execution
# of a fork PR head and reintroducing the full `pull_request_target`
# escalation. This file is that standing control: it runs
# `tools/validate_workflow_trust.py` over every `.github/workflows/**`
# file at a candidate PR's head commit and denies if any of them combine
# (1) a `pull_request_target` trigger, (2) a non-`GITHUB_TOKEN` `secrets.`
# reference, and (3) a checkout/execution of a fork-head reference.
#
# Trust model (mirrors `scn020-trusted-event-contract.yml`'s own,
# independently-reviewed pattern):
#   - Workflow definition: default branch (GitHub-enforced for
#     `pull_request_target` - the definition always comes from the
#     repository's default branch, never the PR's own branch).
#   - Executable validator: `tools/validate_workflow_trust.py`, fetched by
#     immutable SHA (`github.sha`) from the same trusted default-branch
#     snapshot that supplied this definition. Candidate code is NEVER
#     executed, imported, or installed.
#   - Candidate contribution: inert DATA only - the text of
#     `.github/workflows/*.yml`/`*.yaml` at the PR head commit, screened
#     (regular blobs only, no symlinks/gitlinks, path confined to
#     `.github/workflows/`) and read as plain text by the trusted
#     validator's own regex/line scanner. Never parsed as live YAML by
#     anything that would act on it, never run.
#
# No `uses:` line and no `secrets.` reference anywhere in this file, by
# design:
#   - `.claude/rules/infra/iac.md` control 5 requires every `uses:`
#     action to be pinned to a 40-character commit SHA AND carry an
#     APPROVED `CAP-<NNN>` row in `CAPABILITY_REGISTRY.md`; no GitHub
#     Action holds one today, so this workflow uses only runner-image
#     `git`/`python3`/`find`, exactly as `scn020-trusted-event-
#     contract.yml` already does for the same reason.
#   - No `secrets.` reference of any kind, not even `GITHUB_TOKEN` -
#     nothing here needs one. This also makes the file self-consistent
#     with the very control it enforces: run
#     `tools/validate_workflow_trust.py` over this file's own bytes and
#     it ALLOWs, because leg (2) of the hazard predicate (a non-
#     `GITHUB_TOKEN` secrets reference) is absent here regardless of
#     trigger or fork-head references.
#
# NOT claimed:
#   This file is a LOCAL, unmerged control, authored and verified only in
#   this working tree - per the task that produced it, nothing here has
#   been pushed, merged, or wired into GitHub's remote branch-protection
#   "required status checks" list for `main`. It does not become a
#   blocking gate until (a) it is pushed/merged as a real default-branch
#   file and (b) a separate owner action on github.com adds its check-run
#   name (`workflow-trust-lint`) to `main`'s required status checks.
#   Until both of those happen, this is an authored-but-not-yet-live
#   control, not an enforced one - the same honest distinction
#   `scn020-trusted-event-contract.yml` already draws for its own
#   same-name-spoofing caveat.

name: workflow-trust-lint

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-trust-lint:
    name: workflow-trust-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Untrusted values are passed through `env:`, never interpolated
      # into the script body, so no candidate-controlled string can be
      # parsed as shell - same convention as
      # `scn020-trusted-event-contract.yml`.
      - name: Run trusted P2-4 workflow-trust lint against inert candidate data
        env:
          REPO: ${{ github.repository }}
          TRUSTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          deny() { printf 'workflow-trust-lint: DENY - %s\n' "$1" >&2; exit 1; }

          for var in TRUSTED_SHA HEAD_SHA; do
            [[ "${!var}" =~ ^[0-9a-f]{40}$ ]] || deny "$var is not a 40-hex commit sha"
          done
          printf 'trusted=%s head=%s\n' "$TRUSTED_SHA" "$HEAD_SHA"

          # The validator needs Python 3.10+. Assert it rather than
          # assuming the runner image; a wrong interpreter must deny,
          # never silently pass.
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)' \
            || deny "runner python3 is older than 3.10"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          trusted="$work/trusted"
          cand_git="$work/candidate.git"
          cand="$work/candidate"
          url="https://github.com/$REPO.git"

          # --- 1. Trusted default-branch snapshot (validator source) ---
          git init -q "$trusted"
          git -C "$trusted" remote add origin "$url"
          git -C "$trusted" fetch -q --no-tags --depth=1 origin "$TRUSTED_SHA"
          git -C "$trusted" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "$trusted" rev-parse HEAD)" == "$TRUSTED_SHA" ]] \
            || deny "trusted checkout is not $TRUSTED_SHA"
          validator="$trusted/tools/validate_workflow_trust.py"
          [[ -f "$validator" && ! -L "$validator" ]] \
            || deny "trusted snapshot $TRUSTED_SHA has no regular tools/validate_workflow_trust.py"

          # --- 2. Candidate objects, by immutable SHA, never checked out ---
          git init -q "$cand_git"
          git -C "$cand_git" remote add origin "$url"
          git -C "$cand_git" fetch -q --no-tags --depth=1 origin "$HEAD_SHA"
          git -C "$cand_git" cat-file -e "$HEAD_SHA^{commit}" || deny "head $HEAD_SHA is not a commit"

          mkdir -p "$cand/.github/workflows"
          # NUL-delimited listing written to a file, never through
          # `$(...)`: a command substitution silently discards NUL bytes,
          # which would collapse the listing and skip screening entirely
          # (the same fail-open class `scn020-trusted-event-contract.yml`
          # documents and avoids for the identical reason).
          git -C "$cand_git" ls-tree -r --full-tree -z "$HEAD_SHA" \
            -- .github/workflows > "$work/entries.nul" \
            || deny "could not enumerate candidate workflows at $HEAD_SHA"

          candidate_files=()
          while IFS= read -r -d '' record; do
            meta="${record%%$'\t'*}"
            path="${record#*$'\t'}"
            mode="${meta%% *}"
            rest="${meta#* }"
            type="${rest%% *}"
            case "$mode" in
              100644|100755) ;;
              *) deny "refused candidate tree entry mode $mode at '$path' (symlink/gitlink/irregular)" ;;
            esac
            [[ "$type" == "blob" ]] || deny "refused candidate tree entry type $type at '$path'"
            case "$path" in
              .github/workflows/*) ;;
              *) deny "refused out-of-scope candidate path '$path'" ;;
            esac
            case "$path" in
              *.yml|*.yaml) ;;
              *) continue ;;  # non-workflow file under the dir; not fed to the validator
            esac
            dest="$cand/$path"
            mkdir -p "$(dirname "$dest")"
            git -C "$cand_git" cat-file blob "$HEAD_SHA:$path" > "$dest"
            candidate_files+=("$dest")
          done < "$work/entries.nul"

          # Belt-and-braces: nothing materialized may be a symlink, even
          # though every entry was already screened as a regular blob
          # above - second of two independent layers.
          if [[ -n "$(find "$cand" -type l -print -quit)" ]]; then
            deny "symlink present in materialized candidate tree"
          fi

          if [[ "${#candidate_files[@]}" -eq 0 ]]; then
            deny "no .github/workflows/*.yml|*.yaml at PR head $HEAD_SHA"
          fi

          # A candidate must not disable the standing gate after merge.
          # Treat both enforcement files as inert candidate blobs and
          # require exact equality to the trusted default-branch bytes.
          [[ -f "$cand/.github/workflows/workflow-trust.yml" ]] \
            || deny "candidate removed workflow-trust.yml"
          cmp -s "$cand/.github/workflows/workflow-trust.yml" \
            "$trusted/.github/workflows/workflow-trust.yml" \
            || deny "candidate changed workflow-trust.yml"
          git -C "$cand_git" cat-file blob \
            "$HEAD_SHA:tools/validate_workflow_trust.py" | cmp -s - "$validator" \
            || deny "candidate changed or removed trusted validator"

          # --- 3. Trusted validator over inert candidate data ---
          # -E -s: ignore PYTHONPATH and user site-packages. Nothing
          # under $cand is on sys.path or ever imported - it is read as
          # plain text by the validator's own regex scanner.
          set +e
          python3 -E -s "$validator" "${candidate_files[@]}"
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            deny "validate_workflow_trust.py exited $status against PR head $HEAD_SHA"
          fi
          echo "workflow-trust-lint: PASS"
